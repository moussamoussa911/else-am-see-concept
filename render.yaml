services:
  - type: web
    name: else-am-see-concept
    runtime: static
    buildCommand: echo "Static site ready"
    staticPublishPath: .
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /speisekarte
        destination: /speisekarte.html
      - type: rewrite
        source: /reservieren
        destination: /reservieren.html
      - type: rewrite
        source: /am-see
        destination: /am-see.html
      - type: rewrite
        source: /else-flow
        destination: /else-flow.html
      - type: rewrite
        source: /rechtliches
        destination: /rechtliches.html
